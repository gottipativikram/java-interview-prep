<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Java Interview Prep</title>
<meta name="robots" content="noindex"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f4e79"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Java Prep">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root {
    --bg: #f5f7fa; --surface: #ffffff; --ink: #1d2733; --muted: #5b6876; --line: #dfe5ec;
    --brand: #1f4e79; --accent: #e07b1f; --danger: #c62828; --danger-soft: #fbe3e3;
    --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #0e141b; --surface: #151d27; --ink: #e3e9f0; --muted: #97a3b1; --line: #283444;
    --brand: #7fb2e5; --accent: #f0954a; --danger: #ff8a80; --danger-soft: #3a1c1c; color-scheme: dark; } }
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
  .card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line);
          border-radius: 16px; padding: 32px 28px; box-shadow: 0 6px 30px rgba(16,40,70,.10); }
  .logo { width: 44px; height: 44px; border-radius: 11px; background: var(--accent); color: #fff;
          display: grid; place-items: center; font: 800 22px var(--f-display); margin-bottom: 18px; }
  h1 { font: 700 24px/1.2 var(--f-display); margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  input { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
          color: var(--ink); padding: 0 12px; font: inherit; }
  input:focus { outline: 2px solid var(--brand); outline-offset: 1px; background: var(--surface); }
  button { width: 100%; height: 46px; margin-top: 22px; border: 0; border-radius: 10px; background: var(--brand);
           color: #fff; font: 600 15px var(--f-body); cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #0e141b } }
  button:disabled { opacity: .6; cursor: wait; }
  .err { margin-top: 16px; padding: 10px 12px; border-radius: 9px; background: var(--danger-soft); color: var(--danger); font-size: 14px; }
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">J</div>
  <h1>Java Interview Prep</h1>
  <p class="sub">Sign in to open the questions.</p>
  <form id="f" novalidate>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Sign in</button>
    <div id="err" class="err" role="alert" hidden></div>
  </form>
</main>
<script>
(() => {
  // On Vercel the server checks the login (api/login.js); elsewhere (GitHub Pages) it is checked in the browser.
  const SERVER = location.hostname.endsWith('.vercel.app');
  const HASH = '884a939db9c616d1a60737c9a287d150d1a5b42a45fa6d614afd6280ff09cf9e';
  const next = (() => {
    const n = new URLSearchParams(location.search).get('next') || '';
    return /^\/?[\w\-./]*$/.test(n) && !n.includes('..') && !n.startsWith('//') ? n : '';
  })();
  const go = () => location.replace(next ? next.replace(/^\//, SERVER ? '/' : '') : (SERVER ? '/' : 'index.html'));
  const err = document.getElementById('err'), btn = document.getElementById('b');
  const fail = msg => { err.textContent = msg; err.hidden = false; btn.disabled = false; btn.textContent = 'Sign in'; };

  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const username = document.getElementById('u').value.trim();
    const password = document.getElementById('p').value;
    if (!username || !password) return fail('Enter your username and password.');
    btn.disabled = true; btn.textContent = 'Signing in…'; err.hidden = true;
    try {
      if (SERVER) {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        return r.ok ? go() : fail('Username or password is incorrect.');
      }
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(username + ':' + password));
      const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
      if (hex !== HASH) return fail('Username or password is incorrect.');
      try { sessionStorage.setItem('jip-auth', HASH); } catch {}
      go();
    } catch { fail('Could not sign in. Check your connection and try again.'); }
  });
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
